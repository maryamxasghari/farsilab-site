<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FarsiLab · Pack preview</title>
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Vazirmatn:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=20261116b">
</head>
<body>
<div class="wrap">
  <a class="back top" href="index.html#packs">← Back to home</a>

  <div class="doc pack-page" id="pack">
    <h1 id="t"></h1>
    <p class="fa pack-fa" id="fa"></p>
    <p class="lead" id="blurb"></p>
    <ul id="inc"></ul>
    <a class="btn b-etsy buy" id="buy" target="_blank" rel="noopener">
      <span class="ico">🛍️</span><span id="buylabel">Buy on Etsy</span><span id="price"></span></a>

    <h2 class="samples-h">Peek inside<span class="fa">نگاهی به داخل</span></h2>
    <p class="center small">Sample pictures. The real files have no watermark.</p>
    <div class="samples" id="samples"></div>
  </div>

  <p class="center"><a class="back" href="index.html#packs">← Back to all packs</a></p>
</div>

<footer>
  <div class="wrap">
    <p><b>© 2026 FarsiLab. All rights reserved.</b> Please do not copy, share or upload our pictures. <a href="terms.html">Terms of use &amp; copyright</a></p>
  </div>
</footer>

<script src="packs.js?v=20261116b"></script>
<script>
  const id = new URLSearchParams(location.search).get("p");
  const p = PACKS[id];
  if (!p) { location.replace("index.html#packs"); }
  else {
    document.title = "FarsiLab · " + p.title;
    document.getElementById("t").textContent = p.title;
    document.getElementById("fa").textContent = p.fa;
    document.getElementById("blurb").textContent = p.blurb;
    document.getElementById("inc").innerHTML = p.includes.map(x => "<li>" + x + "</li>").join("");
    const buy = document.getElementById("buy");
    buy.href = p.etsy || SHOP;
    document.getElementById("buylabel").textContent = p.etsy ? "Buy on Etsy" : "Shop on Etsy";
    document.getElementById("price").textContent = p.price;
    const s = document.getElementById("samples");
    for (let i = 1; i <= p.samples; i++) {
      const img = document.createElement("img");
      img.src = "assets/samples/" + id + "_" + i + ".webp";
      img.alt = p.title + " sample " + i; img.loading = "lazy";
      img.oncontextmenu = () => false; img.draggable = false;
      s.appendChild(img);
    }
  }
</script>
</body>
</html>
